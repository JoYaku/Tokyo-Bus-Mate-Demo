<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tokyo Bus Mate — Demo（都営バス 上23 ／ 浅草周辺）</title>
<meta name="description" content="日本語が苦手な訪日外国人向けの、都営バス（上23系統・浅草周辺）乗降判断支援 Web アプリの Demo。JA / EN / ZH / KO 切替。">
<link rel="icon" href="assets/logo.png">
<style>
:root{
  --navy:#0b2747;
  --navy-d:#081c33;
  --amber:#dfa440;
  --amber-s:#f4d9a8;
  --ink:#151b21;
  --muted:#5d666d;
  --line:#d9ded7;
  --paper:#f4f5f1;
  --white:#ffffff;
  --red:#cf2a2a;
  --din:"Bahnschrift","DIN Alternate","Segoe UI",system-ui,sans-serif;
  --jp:"Yu Gothic UI","Yu Gothic","Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",Meiryo,sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--jp);-webkit-font-smoothing:antialiased;line-height:1.6;min-height:100vh;display:flex;flex-direction:column}
a{color:inherit}
img{max-width:100%}
::selection{background:var(--amber-s)}

/* ===== ヘッダー ===== */
.site-head{position:sticky;top:0;z-index:60;background:var(--white);border-bottom:1px solid var(--line)}
.head-in{max-width:1180px;margin:0 auto;padding:12px 28px;display:flex;align-items:center;justify-content:space-between;gap:20px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;min-width:0}
.brand img{width:46px;height:46px;border-radius:50%;display:block;flex:0 0 auto}
.brand b{display:block;font-family:var(--din);font-size:19px;font-weight:700;letter-spacing:-.01em;line-height:1.05}
.brand em{display:block;font-style:normal;font-size:11px;color:var(--muted);margin-top:4px;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.head-right{display:flex;align-items:center;gap:12px;flex:0 0 auto}
.plate{background:var(--navy);color:#fff;font-family:var(--din);font-weight:700;font-size:15px;padding:6px 10px;border-radius:4px;letter-spacing:.04em;line-height:1}
.lang{display:inline-flex;align-items:stretch;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--white)}
.lang button{appearance:none;border:0;background:transparent;font-family:var(--din);font-size:12px;font-weight:700;letter-spacing:.05em;color:var(--muted);padding:0 11px;min-height:36px;cursor:pointer;transition:background .15s,color .15s}
.lang button:hover{color:var(--ink);background:#f1f3ee}
.lang button[aria-pressed="true"]{background:var(--navy);color:#fff}
.lang button:focus-visible{outline:2px solid var(--navy);outline-offset:-2px}

/* ===== シェル ===== */
.shell{width:100%;max-width:1180px;margin:0 auto;padding:40px 28px 64px;display:grid;grid-template-columns:264px minmax(0,1fr);gap:56px;align-items:start}
.rail{position:sticky;top:92px;min-width:0}
.rail-title{font-family:var(--din);font-size:11px;letter-spacing:.09em;color:var(--muted);margin:0 0 12px}
.rail-steps{list-style:none;margin:0;padding:0}
.rail-steps li{display:grid;grid-template-columns:30px minmax(0,1fr);gap:12px;align-items:baseline;padding:11px 0;border-bottom:1px solid var(--line)}
.rail-steps .n{font-family:var(--din);font-size:12px;color:var(--muted);text-align:center;border-radius:3px;padding:1px 0}
.rail-steps .t{font-size:13px;font-weight:700;line-height:1.4;color:var(--ink)}
.rail-steps li.on .n{background:var(--navy);color:#fff;font-weight:700}
.rail-steps li.on .t{color:var(--navy)}
.rail-steps li.past .n{color:var(--navy);font-weight:700}

.rail-card{margin-top:22px;background:var(--white);border:1px solid var(--line);border-radius:8px;padding:16px}
.rail-card h4{margin:0 0 10px;font-family:var(--din);font-size:10px;letter-spacing:.1em;color:var(--muted);font-weight:700}
.rail-card dt{font-size:10px;color:var(--muted);letter-spacing:.02em;margin-top:8px}
.rail-card dd{margin:2px 0 0;font-size:13px;font-weight:700;line-height:1.4}
.rail-card dd.none{font-weight:400;color:var(--muted)}
.rail-foot{margin:16px 0 0;font-size:11px;line-height:1.7;color:var(--muted)}

/* モバイル用ステップバー（1080px以下でのみ表示） */
.m-step{display:none}
.m-step .bars{display:flex;gap:5px;flex:0 0 auto}
.m-step .bars i{display:block;width:26px;height:4px;border-radius:2px;background:var(--line)}
.m-step .bars i.on{background:var(--navy)}
.m-step .m-label{font-size:13px;font-weight:700;color:var(--navy);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.m-step .m-count{font-family:var(--din);font-size:11px;color:var(--muted);flex:0 0 auto;margin-left:auto}

/* ===== 画面共通 ===== */
.stage{min-width:0}
.stepnum{font-family:var(--din);font-size:12px;font-weight:700;letter-spacing:.1em;color:var(--navy)}
.scr-title{font-size:clamp(26px,3.4vw,40px);line-height:1.14;margin:8px 0 0;letter-spacing:-.02em;font-weight:700}
.scr-sub{font-size:14px;color:var(--muted);margin:9px 0 0}
.scr-lead{font-size:15px;line-height:1.75;color:var(--muted);margin:12px 0 0;max-width:58ch}
.scr-head{margin-bottom:26px;padding-bottom:22px;border-bottom:1px solid var(--line)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;min-height:52px;padding:0 22px;border:0;border-radius:6px;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;transition:background .18s,border-color .18s,transform .12s;text-decoration:none;text-align:center}
.btn.primary{background:var(--navy);color:#fff}
.btn.primary:hover{background:var(--navy-d)}
.btn.ghost{background:var(--white);color:var(--navy);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--navy)}
.btn:active{transform:translateY(1px)}
.btn:focus-visible,.dest:focus-visible,.stop:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--navy);outline-offset:3px}
.note{font-size:12px;line-height:1.75;color:var(--muted);margin:18px 0 0}

/* ===== ホーム ===== */
.hero{display:grid;grid-template-columns:minmax(0,1fr) 232px;gap:48px;align-items:center;padding-bottom:40px}
.hero > *{min-width:0}
.hero .eyebrow{font-family:var(--din);font-size:11px;letter-spacing:.1em;color:var(--muted);margin:0}
.hero h1{font-size:clamp(32px,4.6vw,58px);line-height:1.1;letter-spacing:-.03em;margin:14px 0 0;font-weight:700}
.hero .tag{font-size:16px;font-weight:700;line-height:1.7;margin:18px 0 0}
.hero .lede{font-size:15px;line-height:1.7;color:var(--muted);margin:10px 0 0;max-width:44ch}
.hero .hero-act{margin-top:26px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.hero-logo{width:100%;max-width:232px;border-radius:50%;display:block;margin:0 auto}
.hero-logo-note{font-family:var(--din);font-size:10px;letter-spacing:.12em;color:var(--muted);text-align:center;margin:12px 0 0}

.places-block{padding-top:36px;border-top:1px solid var(--line)}
.block-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.block-head h2{font-size:15px;font-weight:700;margin:0}
.block-head span{font-family:var(--din);font-size:11px;color:var(--muted);letter-spacing:.06em}
.places-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.place img{display:block;width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:6px;border:1px solid var(--line);background:#e6e8e3}
.place span{display:block;font-size:12px;font-weight:700;margin-top:8px}

/* ===== 目的地カード ===== */
.dest-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.dest-grid > *{min-width:0}
.dest{display:flex;flex-direction:column;background:var(--white);border:1px solid var(--line);border-radius:8px;overflow:hidden;text-align:left;padding:0;cursor:pointer;transition:border-color .18s,box-shadow .18s,transform .18s;font-family:inherit;color:inherit}
.dest:hover{border-color:var(--navy);transform:translateY(-2px);box-shadow:0 16px 32px -24px rgba(11,39,71,.5)}
.dest img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;background:#e6e8e3;flex:0 0 auto}
.dest-body{padding:16px 18px 18px;min-width:0}
.dest-jp{display:block;font-size:23px;font-weight:700;line-height:1.2;letter-spacing:-.01em}
.dest-en{display:block;font-size:12px;color:var(--muted);margin-top:4px}
.dest-dir{display:block;font-size:12px;color:var(--navy);margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}

/* ===== 検索・停留所 ===== */
.search{display:flex;align-items:center;gap:11px;background:var(--white);border:1px solid var(--line);border-radius:8px;padding:0 16px;max-width:560px;transition:border-color .18s,box-shadow .18s}
.search:focus-within{border-color:var(--navy);box-shadow:0 0 0 3px rgba(11,39,71,.1)}
.search svg{flex:0 0 auto;color:var(--muted)}
.search input{flex:1 1 auto;min-width:0;border:0;outline:0;background:transparent;font-family:inherit;font-size:16px;color:var(--ink);padding:15px 0}
.search input::placeholder{color:#98a09c;font-size:13px}
.stop-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:20px}
.stop-grid > *{min-width:0}
.stop{display:flex;align-items:center;gap:12px;background:var(--white);border:1px solid var(--line);border-radius:8px;padding:13px 16px;min-height:64px;text-align:left;cursor:pointer;transition:border-color .18s,background .18s;font-family:inherit;color:inherit}
.stop:hover{border-color:var(--navy);background:#fbfcfa}
.stop svg{flex:0 0 auto;color:var(--muted)}
.stop-txt{min-width:0;flex:1 1 auto}
.stop-jp{display:block;font-size:18px;font-weight:600;line-height:1.3;letter-spacing:-.01em}
.stop-jp.long{font-size:16px}
.stop-ro{display:block;font-family:var(--din);font-size:11px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stop .chev{flex:0 0 auto;color:#b3bbb6}
.stop.wide{grid-column:1/-1}
.empty{display:block;padding:26px 2px;font-size:14px;line-height:1.8;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}
.meta-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.pill{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--white);border-radius:999px;padding:6px 13px;font-size:12px;color:var(--muted)}
.pill b{color:var(--ink);font-weight:700}
.tip{display:flex;gap:12px;align-items:flex-start;margin-top:14px;padding:15px 17px;background:#eef1ee;border-radius:8px;max-width:560px}
.tip svg{flex:0 0 auto;color:var(--navy)}
.tip b{display:block;font-size:12px;font-weight:700;margin-bottom:3px}
.tip span{display:block;font-size:12px;line-height:1.7;color:var(--muted)}

/* ===== 乗車buses確認 ===== */
.match-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:32px;align-items:start}
.match-grid > *{min-width:0}
.shot{margin:0}
.shot-frame{position:relative;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#e6e8e3}
.shot-frame img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;object-position:center 58%}
.pin{position:absolute;left:9%;top:64%;transform:translate(-50%,-50%);width:26px;height:26px;border-radius:50%;background:#fff;color:var(--ink);font-family:var(--din);font-weight:700;font-size:13px;display:grid;place-items:center;box-shadow:0 1px 6px rgba(0,0,0,.45)}
.shot figcaption{font-size:11px;line-height:1.7;color:var(--muted);margin-top:10px}
.check{min-width:0}
.led-cap{font-size:11px;letter-spacing:.03em;color:var(--muted);margin:0 0 8px}
.led{position:relative;background:#0a0d12;border-radius:8px;padding:16px 18px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.07);overflow:hidden}
.led-gloss{font-size:11px;line-height:1.6;color:var(--muted);margin:8px 0 0}
.led::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.24;background:repeating-linear-gradient(to bottom,rgba(0,0,0,.6) 0 1px,transparent 1px 3px)}
.led-row{display:flex;align-items:center;gap:10px}
.led-num{font-family:var(--din);font-size:30px;font-weight:700;color:var(--amber);letter-spacing:.03em;line-height:1;text-shadow:0 0 10px rgba(223,164,64,.45)}
.led-dest{font-size:23px;font-weight:700;color:var(--amber);line-height:1.25;text-shadow:0 0 10px rgba(223,164,64,.45);min-width:0}
.badge{flex:0 0 auto;width:20px;height:20px;border-radius:50%;background:rgba(223,164,64,.92);color:#0a0d12;font-family:var(--din);font-size:11px;font-weight:700;display:grid;place-items:center}

.keys{list-style:none;margin:18px 0 0;padding:0;border-top:1px solid var(--line)}
.keys li{display:grid;grid-template-columns:24px minmax(0,1fr);gap:12px;align-items:start;padding:11px 0;border-bottom:1px solid var(--line)}
.keys .n{width:24px;height:24px;border-radius:50%;background:var(--navy);color:#fff;font-family:var(--din);font-size:12px;font-weight:700;display:grid;place-items:center}
.keys b{display:block;font-size:16px;font-weight:700;line-height:1.35}
.keys span{display:block;font-size:12px;color:var(--muted);margin-top:2px;line-height:1.6}
.act{display:flex;flex-direction:column;gap:10px;margin-top:22px}
.act .btn{width:100%}
.alert{margin-top:14px;border:1px solid rgba(207,42,42,.3);background:#fdf4f3;border-radius:8px;padding:14px 16px;font-size:12px;line-height:1.75;color:#7c2222}
.alert b{display:block;font-size:13px;margin-bottom:3px}
.hidden{display:none!important}

/* ===== 降車 ===== */
.alight-grid{display:grid;grid-template-columns:minmax(0,.92fr) minmax(0,1.08fr);gap:32px;align-items:start}
.alight-grid > *{min-width:0}
.stop-card{border:2px solid var(--red);border-radius:10px;padding:26px 26px 24px;background:var(--white)}
.tag-red{display:inline-flex;align-items:center;gap:7px;background:var(--red);color:#fff;font-size:11px;font-weight:700;letter-spacing:.07em;padding:5px 10px;border-radius:3px}
.stop-card .jp{font-size:clamp(30px,4.4vw,50px);font-weight:700;line-height:1.12;letter-spacing:-.025em;margin:14px 0 0;word-break:break-word}
.stop-card .ro{font-family:var(--din);font-size:17px;color:var(--muted);margin:10px 0 0;line-height:1.4}
.stop-card .walk{font-size:12px;line-height:1.7;color:var(--muted);margin:16px 0 0;padding-top:14px;border-top:1px solid var(--line)}
.fare{display:flex;align-items:baseline;gap:12px;margin-top:20px}
.fare .amt{font-family:var(--din);font-size:30px;font-weight:700;line-height:1}
.fare .note{font-size:12px;line-height:1.6;color:var(--muted);margin:0}
.seq-box{background:var(--white);border:1px solid var(--line);border-radius:10px;padding:22px 24px}
.seq-h{font-size:13px;font-weight:700;margin:0}
.seq-h em{font-style:normal;font-weight:400;font-size:11px;color:var(--muted);margin-left:8px}
.seq{list-style:none;margin:14px 0 0;padding:0}
.seq li{display:grid;grid-template-columns:14px minmax(0,1fr);gap:12px;position:relative;padding:5px 0}
.seq li::after{content:"";position:absolute;left:6px;top:20px;bottom:-5px;width:1px;background:var(--line)}
.seq li:last-child::after{display:none}
.seq .d{width:13px;height:13px;border-radius:50%;border:1.5px solid var(--line);background:#fff;margin-top:4px}
.seq li.start .d{border-color:var(--navy);background:var(--navy)}
.seq li.end .d{border-color:var(--red);background:var(--red)}
.seq .nm{font-size:14px;line-height:1.5}
.seq li.end .nm{font-weight:700}
.seq .lb{font-family:var(--din);font-size:10px;letter-spacing:.05em;color:var(--muted);margin-left:8px}
.seq li.start .lb{color:var(--navy)}
.seq li.end .lb{color:var(--red)}
.seq-note{font-size:11px;line-height:1.75;color:var(--muted);margin:14px 0 0;padding-top:12px;border-top:1px solid var(--line)}

/* ===== フッター ===== */
.site-foot{border-top:1px solid var(--line);background:var(--white)}
.foot-in{max-width:1180px;margin:0 auto;padding:22px 28px;display:flex;justify-content:space-between;gap:28px;flex-wrap:wrap;font-size:11px;line-height:1.8;color:var(--muted)}
.foot-in b{color:var(--ink);font-weight:700}
.foot-in .mono{font-family:var(--din);letter-spacing:.05em}

/* ===== レスポンシブ（端末ごとに別設計） ===== */
/* タブレット〜小型PC：レールを畳み、ステップは横1行のバーに */
@media (max-width:1080px){
  .shell{grid-template-columns:minmax(0,1fr);gap:24px;padding:26px 22px 56px}
  .rail{position:static;order:-1}
  .rail-title,.rail-steps,.rail-card,.rail-foot{display:none}
  .m-step{display:flex;align-items:center;gap:12px;padding:0 0 14px;border-bottom:1px solid var(--line)}
  .m-step.off{display:none!important}
  .hero{grid-template-columns:minmax(0,1fr);gap:22px}
  .hero-logo{max-width:140px;margin:0}
  .hero-logo-note{text-align:left}
  .head-in{padding:10px 22px}
  .brand em{font-size:10px}
}
/* 小型タブレット〜ノートPC：2カラム維持の限界 */
@media (max-width:900px){
  .match-grid,.alight-grid{grid-template-columns:minmax(0,1fr);gap:24px}
  .alight-grid > div > .fare{margin-top:16px}
  .stop-grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .seq .lb{display:block;margin:1px 0 0}
}
/* スマホ：写真を主役にした縦1列＋サムネイル型の目的地リスト＋親指の届く操作バー */
@media (max-width:640px){
  .head-in{padding:9px 16px;gap:10px}
  .brand img{width:36px;height:36px}
  .brand b{font-size:16px}
  .brand em{display:none}
  .plate{font-size:13px;padding:5px 8px}
  .lang button{font-size:11px;padding:0 8px;min-height:32px}
  .shell{padding:18px 16px 40px;gap:18px}
  .m-step{padding-bottom:12px}
  .m-step .bars i{width:20px}
  .hero h1{font-size:31px;letter-spacing:-.02em}
  .hero .tag{font-size:15px;margin-top:14px}
  .hero .lede{font-size:14px}
  .hero .hero-act{margin-top:20px}
  .hero-act .btn{width:100%}
  .hero-mark{display:none}
  .places-row{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .place span{font-size:12.5px;line-height:1.35}
  .dest-grid{grid-template-columns:minmax(0,1fr);gap:12px}
  .dest{flex-direction:row;align-items:stretch}
  .dest img{width:104px;height:auto;min-height:104px;align-self:stretch;aspect-ratio:auto;flex:0 0 auto;border-radius:0}
  .dest-body{padding:12px 14px;display:flex;flex-direction:column;justify-content:center;gap:2px;flex:1 1 auto;min-width:0}
  .dest-jp{font-size:19px}
  .dest-dir{margin-top:7px;padding-top:7px}
  .stop-grid{grid-template-columns:minmax(0,1fr)}
  .stop{padding:14px 16px}
  .scr-head{margin-bottom:18px;padding-bottom:14px}
  .scr-title{font-size:26px}
  .led-num{font-size:26px}
  .led-dest{font-size:20px}
  .act{position:static;background:transparent;margin:20px 0 0;padding:0;border-top:0}
  .alert{margin-top:12px}
  .stop-card{padding:20px 18px}
  .seq-box{padding:18px 18px 16px}
  .fare{margin-top:16px}
  .foot-in{padding:18px 16px;flex-direction:column;gap:10px}
  .foot-in .mono{font-size:10px;letter-spacing:.03em}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<header class="site-head">
  <div class="head-in">
    <a class="brand" href="#/home">
      <img src="assets/logo.png" alt="Tokyo Bus Mate">
      <div>
        <b>Tokyo Bus Mate</b>
        <em id="brandSub"></em>
      </div>
    </a>
    <div class="head-right">
      <span class="plate">上23</span>
      <div class="lang" id="langSw" role="group" aria-label="Language"></div>
    </div>
  </div>
</header>

<div class="shell">
  <aside class="rail">
    <p class="rail-title" id="railTitle">FLOW</p>

        <button class="btn primary" data-go="#/dest">${t('start')}</button>
      </div>
    </div>
    <div class="hero-mark">
      <img class="hero-logo" src="assets/logo.png" alt="Tokyo Bus Mate">
      <p class="hero-logo-note">TOKYO BUS MATE</p>
    </div>
  </section>

  <section class="places-block">
    <div class="block-head">
      <h2>${t('placesHead')}</h2>
      <span>${t('placesMeta')}</span>
    </div>
    <div class="places-row">
      <div class="place"><img src="assets/ueno-zoo.jpg" alt="${DATA.zoo.name.ja}"><span>${placeName('zoo')}</span></div>
      <div class="place"><img src="assets/skytree.jpg" alt="${DATA.skytree.name.ja}"><span>${placeName('skytree')}</span></div>
      <div class="place"><img src="assets/sensoji.jpg" alt="${DATA.senso.name.ja}"><span>${placeName('senso')}</span></div>
    </div>
    <p class="note">${t('photoNote')}</p>
  </section>
`;

V.dest = () => `
  <div class="scr-head">
    <span class="stepnum">${t('stepN', { n: stp(1) })}</span>
    <h2 class="scr-title">${t('s1t')}</h2>
    <p class="scr-sub">${t('s1sub')}</p>
    <p class="scr-lead">${t('s1lead')}</p>
  </div>
  <div class="dest-grid">
    ${Object.keys(DATA).map(k => {
      const d = DATA[k];
      const sub = state.lang === 'ja' ? d.name.en : d.name.ja;
      return `
      <button class="dest" data-dest="${k}">
        <img src="${d.img}" alt="${d.name.ja}">
        <span class="dest-body">
          <span class="dest-jp">${placeName(k)}</span>
          <span class="dest-en">${sub}</span>
          <span class="dest-dir">上23 → ${d.dirJp}</span>
        </span>
      </button>`;
    }).join('')}
  </div>
  <p class="note">${t('s1note')}</p>
`;

V.stop = () => {
  const d = DATA[state.dest || 'zoo'];
  const list = boardStops(d);
  return `
  <div class="scr-head">
    <span class="stepnum">${t('stepN', { n: stp(2) })}</span>
    <h2 class="scr-title">${t('s2t')}</h2>
    <p class="scr-sub">${t('s2sub', { dir: d.dirJp })}</p>
    <p class="scr-lead">${t('s2lead')}</p>
  </div>

  <div class="search">
    ${LOUPE}
    <input id="q" type="search" placeholder="${t('searchPh')}" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="${t('searchPh')}">
  </div>

  <div class="stop-grid" id="stopList">
    ${list.map(s => `
      <button class="stop" data-stop="${s.jp}" data-s="${(s.jp + ' ' + s.ro).toLowerCase()}">
        ${POLE}
        <span class="stop-txt">
          <span class="stop-jp${s.jp.length > 10 ? ' long' : ''}">${s.jp}</span>
          <span class="stop-ro">${s.ro}</span>
        </span>
        ${CHEV}
      </button>`).join('')}
  </div>
  <div class="empty hidden" id="stopEmpty">
    <b>${t('emptyT')}</b><span>${t('emptyS')}</span>
  </div>

  <div class="meta-row">
    <span class="pill"><b>${list.length}</b> ${t('count', { n: '' }).replace('{n}', '')}</span>
    <span class="pill">${t('pillDir')}</span>
  </div>

  ${list.length <= 5 ? `<div class="tip">${POLE}<div><b>${t('tipT')}</b><span>${t('tipB')}</span></div></div>` : ''}

  <p class="note">${t('s2note')}</p>
`;
};

V.match = () => {
  const d = DATA[state.dest || 'zoo'];
  const other = DATA[state.dest === 'skytree' ? 'zoo' : 'skytree'];
  return `
  <div class="scr-head">
    <span class="stepnum">${t('stepN', { n: stp(3) })}</span>
    <h2 class="scr-title">${t('s3t')}</h2>
    <p class="scr-sub">${t('s3sub')}</p>
  </div>

  <div class="match-grid">
    <figure class="shot">
      <div class="shot-frame">
        <img src="assets/bus-toei.jpg" alt="上23">
        <span class="pin" aria-hidden="true">3</span>
      </div>
      <figcaption>${t('photoNote')}</figcaption>
    </figure>

    <div class="check">
      <div class="led-cap">${t('ledCap')}</div>
      <div class="led">
        <div class="led-row"><span class="badge">1</span><span class="led-num">上23</span></div>
        <div class="led-row" style="margin-top:8px"><span class="badge">2</span><span class="led-dest">${d.dirJp}</span></div>
      </div>
      ${state.lang === 'ja' ? '' : `<p class="led-gloss">${d.dirJp}${d.dirRo ? ' / ' + d.dirRo : ''}${d.dirGloss && d.dirGloss[state.lang] ? ' — ' + d.dirGloss[state.lang] : ''}</p>`}

      <ul class="keys">
        <li><span class="n">1</span><div><b>${t('key1t')}</b><span>${t('key1s')}</span></div></li>
        <li><span class="n">2</span><div><b>${t('key2t', { dir: d.dirJp })}</b><span>${t('key2s', { dir: d.dirRo })}</span></div></li>
        <li><span class="n">3</span><div><b>${t('key3t')}</b><span>${t('key3s')}</span></div></li>
      </ul>

      <div class="alert hidden" id="notBus">
        <b>${t('nbT')}</b>${t('nbB', { dir: d.dirJp, other: other.dirJp })}
      </div>

      <div class="act">
        <button class="btn primary" data-go="#/alight">${t('yes')}</button>
        <button class="btn ghost" data-act="notbus">${t('no')}</button>
      </div>
    </div>
  </div>
`;
};

V.alight = () => {
  const d = DATA[state.dest || 'zoo'];
  const boardJp = state.board || '浅草雷門';
  let start = d.route.findIndex(s => s.jp === boardJp);
  const end = d.route.findIndex(s => s.jp === d.alightJp);
  if (start < 0 || start > end) start = Math.max(0, end - 1);
  const seg = [];
  for (let i = start; i <= end; i++) {
    seg.push(`<li class="${i === start ? 'start' : ''}${i === end ? ' end' : ''}">
      <span class="d"></span>
      <span class="nm">${d.route[i].jp}<span class="lb">${i === start ? t('lbBoard') : (i === end ? t('lbOff') : d.route[i].ro)}</span></span>
    </li>`);
  }
  return `
  <div class="scr-head">
    <span class="stepnum">${t('stepN', { n: stp(4) })}</span>
    <h2 class="scr-title">${t('s4t')}</h2>
    <p class="scr-sub">${t('s4sub', { dir: d.dirJp })}</p>
  </div>

  <div class="alight-grid">
    <div>
      <div class="stop-card">
        <span class="tag-red">${t('yourStop')}</span>
        <p class="jp">${d.alightJp}</p>
        <p class="ro">${d.alightRo}</p>
        <p class="walk">${d.walk[state.lang] || d.walk.en}</p>
      </div>
      <div class="fare">
        <span class="amt">¥210</span>
        <span class="note">${t('fareNote1')}<br>${t('fareNote2')}</span>
      </div>
    </div>

    <div class="seq-box">
      <p class="seq-h">${t('seqHead')}</p>
      <ul class="seq">${seg.join('')}</ul>
      <p class="seq-note">${t('seqNote')}<br>${t('seqNote2', { alight: d.alightJp })}</p>
      <div style="margin-top:16px">
        <button class="btn ghost" data-go="#/home">${t('startOver')}</button>
      </div>
    </div>
  </div>
`;
};

/* ---------- ルーター ---------- */
const screenEl = document.getElementById('screen');
const railSteps = document.getElementById('railSteps');
const railDest = document.getElementById('railDest');
const railBoard = document.getElementById('railBoard');
const mBars = document.getElementById('mBars');
const mLabel = document.getElementById('mLabel');
const mCount = document.getElementById('mCount');
const langSw = document.getElementById('langSw');
const STEP = { dest: 0, stop: 1, match: 2, alight: 3 };

/* 言語ボタン（1回だけ生成） */
LANGS.forEach(([code, label, aria]) => {
  const b = document.createElement('button');
  b.type = 'button';
  b.dataset.lang = code;
  b.textContent = label;
  b.setAttribute('aria-label', aria);
  b.addEventListener('click', () => {
    if (state.lang === code) return;
    state.lang = code;
    try { localStorage.setItem('tbm_lang', code); } catch (e) {}
    render();
  });
  langSw.appendChild(b);
});

/* 奇数件のとき、最後の停留所カードを横幅いっぱいに広げる */
function markLastStop() {
  const cards = [...document.querySelectorAll('#stopList .stop')];
  const shown = cards.filter(c => !c.classList.contains('hidden'));
  cards.forEach(c => c.classList.remove('wide'));
  if (shown.length % 2 === 1) shown[shown.length - 1].classList.add('wide');
}

function render() {
  const hash = location.hash || '#/home';
  const key = hash.replace('#/', '');
  const known = V[key] ? key : 'home';
  if (known === 'home') { state.dest = null; state.board = null; }

  /* 途中の画面を直接開いた場合でも表示内容と選択カードが食い違わないように補う */
  if (known === 'match' || known === 'alight') {
    if (!state.dest || !DATA[state.dest]) state.dest = 'zoo';
    if (!state.board) {
      const first = boardStops(DATA[state.dest])[0];
      if (first) state.board = first.jp;
    }
  }

  document.documentElement.lang = state.lang === 'zh' ? 'zh-Hans' : state.lang;
  document.title = 'Tokyo Bus Mate — Demo（都営バス 上23 ／ 浅草周辺）';

  /* ヘッダー・レール・フッターの文言 */
  document.getElementById('brandSub').textContent = t('brandSub');
  document.getElementById('railTitle').textContent = t('railTitle');
  document.getElementById('selHead').textContent = t('selHead');
  document.getElementById('selDest').textContent = t('selDest');
  document.getElementById('selBoard').textContent = t('selBoard');
  document.getElementById('railFoot').textContent = t('railFoot');
  document.getElementById('footNote').textContent = t('footNote');
  langSw.querySelectorAll('button').forEach(b => {
    b.setAttribute('aria-pressed', b.dataset.lang === state.lang ? 'true' : 'false');
  });

  /* 左レール（PC） */
  const idx = known === 'home' ? -1 : STEP[known];
  railSteps.innerHTML = t('steps').map((label, i) =>
    `<li class="${i === idx ? 'on' : (idx > i ? 'past' : '')}"><span class="n">0${i + 1}</span><span class="t">${label}</span></li>`
  ).join('');

  /* ステップバー（タブレット・スマホ） */
  const mStep = document.getElementById('mStep');
  mStep.classList.toggle('off', known === 'home');
  [...mBars.children].forEach((el, i) => { el.className = (idx >= i && idx > -1) ? 'on' : ''; });
  mLabel.textContent = idx > -1 ? t('steps')[idx] : '';
  mCount.textContent = idx > -1 ? (idx + 1) + ' / 4' : '';

  /* 本文 */
  screenEl.innerHTML = V[known]();
  if (known === 'stop') markLastStop();

  const d = DATA[state.dest];
  railDest.textContent = d ? placeName(state.dest) : t('none');
  railDest.className = d ? '' : 'none';
  railBoard.textContent = state.board || t('none');
  railBoard.className = state.board ? '' : 'none';
}

document.addEventListener('click', e => {
  const go = e.target.closest('[data-go]');
  if (go) { location.hash = go.dataset.go; return; }

  const dest = e.target.closest('[data-dest]');
  if (dest) { state.dest = dest.dataset.dest; location.hash = '#/stop'; return; }

  const stop = e.target.closest('[data-stop]');
  if (stop) { state.board = stop.dataset.stop; location.hash = '#/match'; return; }

  const act = e.target.closest('[data-act]');
  if (act && act.dataset.act === 'notbus') {
    const a = document.getElementById('notBus');
    if (a) a.classList.toggle('hidden');
  }
});

/* 停留所検索：表示中のカードだけを絞り込む（再描画しない＝入力フォーカスを保つ） */
screenEl.addEventListener('input', e => {
  if (e.target.id !== 'q') return;
  const q = e.target.value.trim().toLowerCase();
  let n = 0;
  document.querySelectorAll('#stopList .stop').forEach(el => {
    const hit = !q || el.getAttribute('data-s').indexOf(q) > -1;
    el.classList.toggle('hidden', !hit);
    if (hit) n++;
  });
  const empty = document.getElementById('stopEmpty');
  if (empty) empty.classList.toggle('hidden', n > 0);
  markLastStop();
});

window.addEventListener('hashchange', render);
render();
</script>
</body>
</html>
